[project]
name = "cc-harness"
version = "0.1.0"
description = "Terminal coding agent with MCP tools"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.40",
  "mcp[cli]>=1.27,<2",
  "rich>=13.7",
  "tiktoken>=0.7",
  "python-dotenv>=1.0",
  "pydantic>=2.6",
  "requests>=2.31",
  "numpy>=1.24",
  "PyYAML>=6.0",
  "jsonschema>=4.21",
  "deepeval>=0.21",
  "langfuse>=2.0,<3",
  "prompt-toolkit>=3.0.48,<4",
  "Pillow>=10.0",
  "aiosqlite>=0.20",
  "sqlite-vec>=0.1.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-cov>=5.0", "ruff==0.16.1"]
dlp = ["presidio-analyzer>=2.2"]
sandbox = ["opensandbox==0.1.15", "opensandbox-server==0.2.2"]
benchmarks = ["agentdojo==0.1.35"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cc_harness"]

[project.scripts]
cc-harness = "cc_harness.entrypoint:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
testpaths = ["tests"]
markers = [
  "requires_llm: gated tests requiring real OPENAI_API_KEY + CC_HARNESS_RUN_REAL_LLM=1 (skipped by default)",
  "sandbox_conformance: gated tests requiring Docker + CC_HARNESS_RUN_SANDBOX_CONFORMANCE=1",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["eval/result"]
