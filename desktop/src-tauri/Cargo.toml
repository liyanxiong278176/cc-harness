[package]
name = "cc-harness-desktop"
version = "0.1.2"
description = "Optional local desktop client for cc-harness"
authors = ["lyx"]
edition = "2021"

[lib]
name = "cc_harness_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.2", features = [] }

[dependencies]
tauri = { version = "2.5", features = ["tray-icon"] }
tauri-plugin-shell = "2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
