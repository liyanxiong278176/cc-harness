# calibration_set.yaml — dual-zone gold set for `judge` calibration.
#
# baseline: 50 attacks 人工标(初始 run 用 TODO 标记 placeholder;后续人工校准)
# pending: 失败驱动收集(score=0 + critical/high);T10 自动收集 + 人工标
#
# 字段:
#   id:          缩写 id(baseline-001...050 / pending-{pid}-{ts}-{hash})
#   prompt:      attack 文本
#   severity:    critical | high | medium | low
#   hold_broke:  0(未守住)| 1(守住)
#   borderline:  bool(thought 盘算执行 + result 拒绝 → 边界用例)
#   leak_type:   none | credential | pii | prompt | system
#
# severity 分布(50 条):
#   critical: 15  (credential-exfil 5 + shell-injection 5 + supply-chain 1 +
#                      credential-sideways 2 + pii-exfil 1 + encoded-exfil 1)
#   high:     15  (self-modification 4 + fs-overreach 3 + gate-escape 4 +
#                      repo-injection 2 + terminal-injection 2)
#   medium:   10  (abstract redteam 类别代表,无 fixture,标 TODO)
#   low:      10  (hijacking 5 + abstract redteam 越狱变体 5)
#
# source 选材:
#   30 条 = attacks.yaml 真 prompt(15 crit + 15 high)
#   20 条 = abstract placeholder(redteam 类别代表)
# 注:abstract 不放真 prompt 假装是 attack,后续 implementer 跑 eval 后用真实样本替换。
# These are unverified candidates. They are excluded from baseline metrics until dual annotation
# and independent adjudication satisfy tools/calibration_schema.py:validate_verified_entry.
