name: desktop-release

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: "**/*.msi"
          - name: macOS Intel
            os: macos-15-intel
            target: x86_64-apple-darwin
            bundle: "**/*.dmg"
          - name: macOS Apple Silicon
            os: macos-15
            target: aarch64-apple-darwin
            bundle: "**/*.dmg"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Python bridge and packager
        run: python -m pip install . pyinstaller
      - name: Build Tauri sidecar
        run: python scripts/build_desktop_sidecar.py --target ${{ matrix.target }}
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci
      - name: Generate platform application icons
        working-directory: desktop
        run: npx tauri icon src-tauri/icons/app-icon.svg
      - name: Build installer
        working-directory: desktop
        run: npm run tauri build -- --target ${{ matrix.target }}
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: cc-harness-${{ matrix.target }}
          path: desktop/src-tauri/target/${{ matrix.target }}/release/bundle/${{ matrix.bundle }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/**/*
