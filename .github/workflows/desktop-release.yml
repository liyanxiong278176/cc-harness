name: desktop-release

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: "**/*.msi"
          - name: macOS Intel
            os: macos-15-intel
            target: x86_64-apple-darwin
            bundle: "**/*.dmg"
          - name: macOS Apple Silicon
            os: macos-15
            target: aarch64-apple-darwin
            bundle: "**/*.dmg"
    runs-on: ${{ matrix.os }}
    env:
      # Use neutral names so an empty secret is never auto-discovered by
      # Tauri as APPLE_CERTIFICATE/WINDOWS_CERTIFICATE.
      CC_WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      CC_WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      CC_WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
      CC_WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
      CC_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      CC_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      CC_KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      CC_APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      CC_APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      CC_APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Python bridge and packager
        run: python -m pip install . pyinstaller
      - name: Build Tauri sidecar
        run: python scripts/build_desktop_sidecar.py --target ${{ matrix.target }}
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci
      - name: Generate platform application icons
        working-directory: desktop
        run: npx tauri icon src-tauri/icons/app-icon.svg
      - name: Import Windows signing certificate
        if: matrix.target == 'x86_64-pc-windows-msvc' && env.CC_WINDOWS_CERTIFICATE != ''
        shell: pwsh
        env:
          CC_WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          CC_WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          CC_WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
          CC_WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
        run: |
          $required = @(
            'CC_WINDOWS_CERTIFICATE_PASSWORD',
            'CC_WINDOWS_CERTIFICATE_THUMBPRINT'
          )
          foreach ($name in $required) {
            if ([string]::IsNullOrWhiteSpace((Get-Item "Env:$name").Value)) {
              throw "$name must be configured when WINDOWS_CERTIFICATE is set"
            }
          }
          $signingDir = Join-Path $env:RUNNER_TEMP 'cc-harness-signing'
          New-Item -ItemType Directory -Force -Path $signingDir | Out-Null
          $encoded = Join-Path $signingDir 'certificate.txt'
          $pfx = Join-Path $signingDir 'certificate.pfx'
          Set-Content -Path $encoded -Value $env:CC_WINDOWS_CERTIFICATE -NoNewline
          certutil -f -decode $encoded $pfx
          if ($LASTEXITCODE -ne 0) { throw 'Unable to decode WINDOWS_CERTIFICATE' }
          Remove-Item -Force $encoded
          $password = ConvertTo-SecureString $env:CC_WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password | Out-Null

          # The thumbprint is public certificate metadata, but keeping it as a
          # secret lets the workflow rotate certificates without a code change.
          $configPath = Join-Path $env:GITHUB_WORKSPACE 'desktop/src-tauri/tauri.conf.json'
          $config = Get-Content -Raw $configPath | ConvertFrom-Json
          if (-not $config.bundle.windows) {
            $config.bundle | Add-Member -NotePropertyName windows -NotePropertyValue ([PSCustomObject]@{})
          }
          $thumbprint = ($env:CC_WINDOWS_CERTIFICATE_THUMBPRINT -replace '\s', '').ToUpperInvariant()
          $timestampUrl = if ([string]::IsNullOrWhiteSpace($env:CC_WINDOWS_TIMESTAMP_URL)) {
            'http://timestamp.digicert.com'
          } else { $env:CC_WINDOWS_TIMESTAMP_URL }
          $config.bundle.windows | Add-Member -Force -NotePropertyName certificateThumbprint -NotePropertyValue $thumbprint
          $config.bundle.windows | Add-Member -Force -NotePropertyName digestAlgorithm -NotePropertyValue 'sha256'
          $config.bundle.windows | Add-Member -Force -NotePropertyName timestampUrl -NotePropertyValue $timestampUrl
          $config | ConvertTo-Json -Depth 50 | Set-Content -Encoding UTF8 $configPath
      - name: Import macOS signing certificate and notarization key
        if: contains(matrix.target, '-apple-darwin') && env.CC_APPLE_CERTIFICATE != ''
        shell: bash
        env:
          CC_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          CC_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          CC_KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          CC_APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          CC_APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          CC_APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          for name in CC_APPLE_CERTIFICATE_PASSWORD CC_KEYCHAIN_PASSWORD CC_APPLE_API_ISSUER CC_APPLE_API_KEY CC_APPLE_API_PRIVATE_KEY; do
            if [[ -z "${!name:-}" ]]; then
              echo "$name must be configured when APPLE_CERTIFICATE is set" >&2
              exit 1
            fi
          done
          signing_dir="$RUNNER_TEMP/cc-harness-signing"
          keychain="$signing_dir/build.keychain-db"
          mkdir -p "$signing_dir"
          printf '%s' "$CC_APPLE_CERTIFICATE" | base64 -D > "$signing_dir/certificate.p12"
          security create-keychain -p "$CC_KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$CC_KEYCHAIN_PASSWORD" "$keychain"
          security import "$signing_dir/certificate.p12" \
            -k "$keychain" -P "$CC_APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security list-keychains -d user -s "$keychain" "$HOME/Library/Keychains/login.keychain-db"
          security default-keychain -s "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$CC_KEYCHAIN_PASSWORD" "$keychain"
          identity="$(security find-identity -v -p codesigning "$keychain" | \
            awk -F '"' '/Developer ID Application/{print $2; exit}')"
          if [[ -z "$identity" ]]; then
            echo 'Developer ID Application identity was not found after import' >&2
            exit 1
          fi
          echo "APPLE_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
          api_key_dir="$RUNNER_TEMP/private_keys"
          mkdir -p "$api_key_dir"
          printf '%s' "$CC_APPLE_API_PRIVATE_KEY" > "$api_key_dir/AuthKey_${CC_APPLE_API_KEY}.p8"
          echo "APPLE_API_KEY_PATH=$api_key_dir/AuthKey_${CC_APPLE_API_KEY}.p8" >> "$GITHUB_ENV"
      - name: Build installer
        working-directory: desktop
        run: npm run tauri build -- --target ${{ matrix.target }}
      - name: Verify Windows signature
        if: matrix.target == 'x86_64-pc-windows-msvc' && env.CC_WINDOWS_CERTIFICATE != ''
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle' -Recurse -Filter '*.msi' | Select-Object -First 1
          if (-not $installer) { throw 'MSI installer was not found' }
          $signature = Get-AuthenticodeSignature $installer.FullName
          if ($signature.Status -ne 'Valid') { throw "Invalid Windows signature: $($signature.Status)" }
      - name: Verify macOS signature
        if: contains(matrix.target, '-apple-darwin') && env.CC_APPLE_CERTIFICATE != ''
        shell: bash
        run: |
          set -euo pipefail
          app="$(find "desktop/src-tauri/target/${{ matrix.target }}/release/bundle" -type d -name '*.app' -print -quit)"
          if [[ -z "$app" ]]; then
            echo 'macOS application bundle was not found' >&2
            exit 1
          fi
          codesign --verify --deep --strict "$app"
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: cc-harness-${{ matrix.target }}
          path: desktop/src-tauri/target/${{ matrix.target }}/release/bundle/${{ matrix.bundle }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/**/*
