name: cc-harness weekly security eval

on:
  schedule:
    - cron: "17 18 * * 5"
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  redteam-subset:
    name: Promptfoo red-team subset / deepseek-v4-flash
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OPENAI_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      OPENAI_BASE_URL: https://api.deepseek.com/v1
      OPENAI_MODEL: deepseek-v4-flash
      CC_HARNESS_RUN_REAL_LLM: "1"
      PYTHONIOENCODING: utf-8

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: eval/promptfoo/package-lock.json
      - name: Require DeepSeek credentials
        if: env.OPENAI_API_KEY == ''
        run: |
          echo "DEEPSEEK_API_KEY is required for the scheduled red-team gate"
          exit 1
      - name: Install harness and Promptfoo
        run: |
          python -m pip install -e .
          npm ci --prefix eval/promptfoo
      - name: Generate bounded attacks
        working-directory: eval/promptfoo
        run: >-
          npx promptfoo redteam generate
          -c promptfooconfig.ci.yaml
          -o redteam.ci.yaml
          --strict
      - name: Evaluate bounded attacks
        working-directory: eval/promptfoo
        run: >-
          npx promptfoo redteam eval
          -c redteam.ci.yaml
          -j 1
          -o redteam.ci.json
      - name: Preserve raw framework evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: promptfoo-redteam-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 30
          path: |
            eval/promptfoo/redteam.ci.yaml
            eval/promptfoo/redteam.ci.json
