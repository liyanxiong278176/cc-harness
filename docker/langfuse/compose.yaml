name: cc-harness-observability
x-app-env: &app-env
  DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?required}@postgres:5432/langfuse
  NEXTAUTH_URL: http://localhost:3060
  SALT: ${SALT:?required}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:?required}
  TELEMETRY_ENABLED: "false"
  CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
  CLICKHOUSE_URL: http://clickhouse:8123
  CLICKHOUSE_USER: langfuse
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?required}
  CLICKHOUSE_CLUSTER_ENABLED: "false"
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_AUTH: ${REDIS_AUTH:?required}
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_PASSWORD:?required}
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
  LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: langfuse
  LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_PASSWORD:?required}
  LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio:9000
  LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_OBSERVATION_FIELD_OVERFLOW_ENABLED: "true"
  LANGFUSE_OBSERVATION_FIELD_SIZE_LIMIT_BYTES: "2097152"
x-dependencies: &dependencies
  postgres: {condition: service_healthy}
  clickhouse: {condition: service_healthy}
  redis: {condition: service_healthy}
  minio: {condition: service_healthy}
x-logging: &logging
  driver: local
  options: {max-size: 10m, max-file: "3"}
services:
  web:
    image: docker.langfuse.com/langfuse/langfuse@sha256:932a46dfab770f89ecb2ec35258b6b80d3be8773403981a64d271ff0a408deef
    restart: unless-stopped
    logging: *logging
    depends_on: *dependencies
    environment:
      <<: *app-env
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?required}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://localhost:9090
      LANGFUSE_S3_MEDIA_UPLOAD_INTERNAL_ENDPOINT: http://minio:9000
      LANGFUSE_INIT_ORG_ID: cc-harness
      LANGFUSE_INIT_ORG_NAME: cc-harness
      LANGFUSE_INIT_PROJECT_ID: cc-harness-local
      LANGFUSE_INIT_PROJECT_NAME: cc-harness-local
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:?required}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY:?required}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_USER_EMAIL:?required}
      LANGFUSE_INIT_USER_NAME: Local Developer
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_USER_PASSWORD:?required}
  worker:
    image: docker.langfuse.com/langfuse/langfuse-worker@sha256:3b3b204fa72fd02d010ab90c667d07281e4b9ec3b5b0b1d21470ac2624b8a564
    restart: unless-stopped
    logging: *logging
    depends_on: *dependencies
    environment: *app-env
  audit-proxy:
    image: python@sha256:d98cc29d3266e535dd9da1099688d9cb3ca4753813571e071763d17725460962
    restart: unless-stopped
    logging: *logging
    depends_on: [web]
    ports: ["127.0.0.1:3060:3000"]
    command: [python, -I, /app/audit_proxy.py]
    environment:
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:?required}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:?required}
    volumes:
      - ./audit_proxy.py:/app/audit_proxy.py:ro
      - ../../cc_harness/secret_patterns.py:/app/secret_patterns.py:ro
      - annotation-audit:/audit
    read_only: true
    tmpfs: [/tmp]
  postgres:
    image: postgres@sha256:b8faeff7712663c2773a190181e1246e37e364b887611c04658c28b44e2408fe
    restart: unless-stopped
    logging: *logging
    environment: {POSTGRES_USER: postgres, POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?required}", POSTGRES_DB: langfuse}
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck: {test: [CMD-SHELL, "pg_isready -U postgres -d langfuse"], interval: 5s, timeout: 5s, retries: 20}
  clickhouse:
    image: clickhouse/clickhouse-server@sha256:8a790dd3468db22b1d4e7b18a176f378ff5ff6053b9c48dd4ea1fa71a24c5ba6
    restart: unless-stopped
    logging: *logging
    user: "101:101"
    environment: {CLICKHOUSE_USER: langfuse, CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD:?required}", CLICKHOUSE_DB: default}
    volumes: ["clickhouse:/var/lib/clickhouse", "clickhouse-logs:/var/log/clickhouse-server"]
    healthcheck: {test: [CMD-SHELL, "wget -q -O - http://localhost:8123/ping"], interval: 5s, timeout: 5s, retries: 30}
  redis:
    image: redis@sha256:1009f15ccd9ed271996d1c65745a1ab1dadedea188feb3f1ab938602a32e50a3
    restart: unless-stopped
    logging: *logging
    environment: {REDIS_AUTH: "${REDIS_AUTH:?required}"}
    command: [sh, -c, 'exec redis-server --appendonly yes --maxmemory-policy noeviction --requirepass "$$REDIS_AUTH"']
    volumes: ["redis:/data"]
    healthcheck: {test: [CMD-SHELL, 'redis-cli -a "$$REDIS_AUTH" ping'], interval: 5s, timeout: 5s, retries: 20}
  minio:
    image: cgr.dev/chainguard/minio@sha256:87896cb33f93ecfcca4e883c3fb2f86a0a1a600c003a104011ed30631c1869c3
    restart: unless-stopped
    logging: *logging
    entrypoint: sh
    command: ["-c", 'mkdir -p /data/langfuse && minio server --address :9000 --console-address :9001 /data']
    environment: {MINIO_ROOT_USER: langfuse, MINIO_ROOT_PASSWORD: "${MINIO_PASSWORD:?required}"}
    ports: ["127.0.0.1:9090:9000", "127.0.0.1:9091:9001"]
    volumes: ["objects:/data"]
    healthcheck: {test: [CMD, mc, ready, local], interval: 5s, timeout: 5s, retries: 20}
volumes:
  annotation-audit: {}
  postgres: {}
  clickhouse: {}
  clickhouse-logs: {}
  redis: {}
  objects: {}
